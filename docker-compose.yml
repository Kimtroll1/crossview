services:
  postgres:
    image: postgres:16
    container_name: crossview-postgres
    environment:
      POSTGRES_DB: crossview
      POSTGRES_USER: crossview
      POSTGRES_PASSWORD: crossview
    ports:
      - "5432:5432"
    volumes:
      - crossview_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossview -d crossview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crossview_pg_data:
